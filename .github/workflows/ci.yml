name: testler

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: python kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: paketleri yukle
      run: |
        pip install -r requirements.txt
        pip install pytest
    - name: testi calistir
      run: |
        pytest test_kontrol.py
